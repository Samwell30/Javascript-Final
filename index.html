<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Finder Project</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>
    <section id="landing">
        <nav class="nav__container">
            <div class="row nav__row">
                <div class="nav__logo">
                    <img class="nav__logo--img" src="./assets/reshot-icon-watching-movie-32C8NVGJWH.svg" alt="">
                    <div class="nav__logo--title">Blinker</div>
                </div>
                <div class="nav__links">
                    <a href="#" class="nav__link">About</a>
                    <a href="#" class="nav__link">Find a movie</a>
                    <a href="#" class="nav__link nav__link--primary">Contact</a>
                </div>
                <button class="btn__menu" >
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </nav>
    </section>
    <section>
        <div class="container">
          <h1 class="title">The quick and Easy movie finder</h1>
          <h2 class="sub-title">Type a keyword and search</h2>
          <div class="input__wrapper">
            <input type="text" id="searchInput" placeholder="Search for a movie" onchange="searchMovie()">
             <button id="searchButton">Search</button>
            </div>
            <div class="movie-section">
            <div id="loading" style="display: none;">Loading...</div>          
          <div id="output">Movie info will appear here....</div>
        </div>
      </section>      
      </body>
</html>
